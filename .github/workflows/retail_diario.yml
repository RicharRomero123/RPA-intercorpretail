# Carga diaria del sell-out de Supermercados Peruanos (portal B2B de Intercorp) a Supabase.
# SPSA publica una vez al día la venta del día anterior: se intenta varias veces en la mañana; si el día ya
# está cargado, el robot termina en segundos. A las 12:00 (Lima), si ayer sigue sin publicarse, el flujo
# falla a propósito y GitHub avisa por correo.
# Además corre a las 23:41 como respaldo: el portal no tiene la venta del día en curso (SPSA publica el día
# anterior), pero recoge lo que se haya publicado tarde o lo que una corrida de la mañana no pudo cargar.
# Horas en UTC (Lima = UTC-5): 12 = 7:00, 13 = 8:00 ... 17 = 12:00; 4:41 UTC = 23:41 del día anterior en Lima.
# GitHub retrasa o se salta corridas programadas cuando está cargado, sobre todo en punto (xx:00): por eso se usan
# minutos «raros» (:07 y :37) y se intenta cada 30 minutos. Respaldo: tarea de Windows en la laptop (rpa/retail_diario.bat).
name: Retail SPSA diario

on:
  schedule:
    - cron: "7,37 12-18 * * *"   # cada 30 min de 7:07 a 13:37 (Lima); a las 12 avisa por correo si ayer sigue sin publicarse
    - cron: "41 4 * * *"         # 23:41 (Lima): respaldo del cierre del día
  workflow_dispatch:   # botón "Run workflow" para correrlo a mano
    inputs:
      desde:
        description: "Desde (AAAA-MM-DD), vacío = lo que falte"
        required: false
      hasta:
        description: "Hasta (AAAA-MM-DD), vacío = último publicado"
        required: false

concurrency:
  group: retail-diario
  cancel-in-progress: false

jobs:
  cargar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: America/Lima
      INTERCORP_USUARIO: ${{ secrets.INTERCORP_USUARIO }}
      INTERCORP_CLAVE: ${{ secrets.INTERCORP_CLAVE }}
      # Contraseña de la base tal cual (sin codificar); el robot arma la dirección del pooler de Supabase.
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: eyqeitzesywaukvfllyc
      SUPABASE_POOLER_HOST: aws-0-us-east-1.pooler.supabase.com
      DATABASE_URL: ${{ secrets.DATABASE_URL }}   # alternativa: dirección completa (se usa si no hay contraseña)
      MARCA: CALDERON
    defaults:
      run:
        working-directory: rpa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: rpa/requirements.txt
      - run: pip install -r requirements.txt
      - name: Cargar días pendientes
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.desde }}" ]; then ARGS="$ARGS --desde ${{ github.event.inputs.desde }}"; fi
          if [ -n "${{ github.event.inputs.hasta }}" ]; then ARGS="$ARGS --hasta ${{ github.event.inputs.hasta }}"; fi
          # En la corrida de las 12:00 se exige que ayer ya esté cargado (si no, falla y llega el aviso).
          if [ "$(date +%H)" = "12" ]; then ARGS="$ARGS --avisar-si-falta"; fi
          python retail_diario.py $ARGS
